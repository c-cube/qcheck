name: build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  run:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ocaml-compiler:
          - "4.11"
          - "4.12"
          - "4.14"
          - "5.0"
          - "5.1"
          - "5.2"
          - "5.3"
          - "5.4"
        exclude:
          - os: macos-latest
            ocaml-compiler: "4.11"
          - os: windows-latest
            ocaml-compiler: "4.11"
          - os: windows-latest
            ocaml-compiler: "4.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - run: opam update -y
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest
